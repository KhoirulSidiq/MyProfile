<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 5</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
     
</head>
<body>

    <div class="container mt-3 bg-warning rounded-3">

        <h4 class="text-primary text-center p-5">FORMULIR PENDAFTARAN SISWA BARU</h4>
        
        <div class="form-floating mb-3">
            <input type="Text" placeholder="Masukkan NIPD" class="form-control">
            <label>NIPD</label>
        </div>

        <div class="form-floating mb-3">
            <input type="text" placeholder="Nama Lengkap" class="form-control">
            <label>Nama Lengkap</label>
        </div>

        <div class="form-floating mb-3">
            <input type="text" placeholder="Email" class="form-control">
            <label>Email</label>
        </div>

         <div class="form-floating mb-3">
            <textarea class="form-control" placeholder="Alamat Lengkap"></textarea>
            <label>Alamat Lengkap</label>
        </div>

        <div class="form-floating mb-3">
            <select class="form-select">
                <option>Rekayasa Perangkat Lunak</option>
                <option>Teknik Jaringan Dan Komputer</option>
                <option>Desain Visual Kmunikasi</option>
                <option>Bisnis Digital</option>
                <option>Akuntansi</option>
            </select>
            <label>Pilih Jurusan</label>
        </div>

        <div class="mb-3" form-check>
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Badminton</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Pramuka</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Pmr (palang Merah Remaja)</label>
        </div>

        <div>
            <div class="row">
                <div class="col-6">
                    <input class="form-check-input" type="radio" name="jk">
            <label class="form-check-label">Laki-Laki</label>
                </div>
                <div class="col-6">
                    <input class="form-check-input" type="radio" name="jk">
            <label class="form-check-label">Perempuan</label>
                </div>
            </div>
        </div>

        <button type="button" class="btn btn-danger" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Untuk Simpan Data">Simpan Data</button>
        <button class="btn btn-success">Hapus Data</button>

    </div>
    <script>
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
        const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
     </script>

</body>
</html>
